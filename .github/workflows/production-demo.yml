name: Arabic production demo
on:
  pull_request:
    paths:
      - 'video/src/production/**'
      - 'video/src/Root.tsx'
      - 'video/PRODUCTION.md'
      - '.github/workflows/production-demo.yml'
jobs:
  render:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Render Arabic production video
        run: |
          mkdir -p out/production
          npx remotion render src/index.ts ProductionDemo out/production/arabic-production.mp4 --codec h264 --crf 24
          test -s out/production/arabic-production.mp4
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: arabic-production-demo-mp4
          path: video/out/production/
          if-no-files-found: error
