name: Agent production checks
on:
  pull_request:
    paths:
      - '.agents/skills/motion-from-reference/scripts/production*.py'
      - '.agents/skills/motion-from-reference/scripts/validate_production.py'
      - '.agents/skills/motion-from-reference/scripts/test_production.py'
      - '.github/workflows/agent-production.yml'
jobs:
  python-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test production tools
        run: python -m unittest discover -s .agents/skills/motion-from-reference/scripts -p 'test_production.py' -v
