name: Real MP4 smoke render
on:
  pull_request:
    paths:
      - '.github/workflows/video-smoke-render.yml'
      - 'video/src/styles/**'
      - 'video/src/Root.tsx'
jobs:
  render-mp4:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Render a real six-second MP4
        run: |
          mkdir -p out/video-smoke
          npx remotion render src/index.ts Style-editorial-motion out/video-smoke/editorial-motion.mp4 --codec h264 --crf 24 --log verbose
      - name: Install FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          command -v ffprobe
      - name: Probe video stream and duration
        run: |
          set -euo pipefail
          test -s out/video-smoke/editorial-motion.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of json out/video-smoke/editorial-motion.mp4 > out/video-smoke/metadata.json
          test -s out/video-smoke/metadata.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("out/video-smoke/metadata.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          streams = data.get("streams", [])
          fmt = data.get("format", {})
          assert any(s.get("codec_name") == "h264" and s.get("width") == 1920 and s.get("height") == 1080 for s in streams), data
          duration = float(fmt["duration"])
          assert 5.9 <= duration <= 6.1, f"Unexpected duration: {duration}"
          assert int(fmt["size"]) > 0, "Video is empty"
          print(f"Verified H.264 1920x1080 video, duration={duration:.3f}s, size={fmt['size']} bytes")
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: actual-editorial-motion-mp4
          path: video/out/video-smoke/
          if-no-files-found: warn
